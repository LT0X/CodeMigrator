[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codemigrator"
version = "0.1.0"
description = "A deterministic, evidence-driven cross-language code migration system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "pydantic>=2.8,<3",
    "rfc8785>=0.1,<1",
    "semver>=3,<4",
    "sse-starlette>=2.1,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24,<26",
    "tree-sitter>=0.23,<1",
    "uuid-utils>=0.17,<1",
]

[project.scripts]
codemigrator-app = "codemigrator.runtime:main"

[dependency-groups]
dev = [
    "import-linter>=2.5,<3",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codemigrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["my_space", "ref", "temp_doc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP040", "UP042"]

[tool.ruff.lint.per-file-ignores]
"src/codemigrator/core/__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["codemigrator"]
exclude = "(^tests/|^my_space/)"

[tool.importlinter]
root_package = "codemigrator"

[[tool.importlinter.contracts]]
name = "frozen layers"
type = "layers"
layers = [
    "codemigrator.runtime",
    "codemigrator.api",
    "codemigrator.sandbox | codemigrator.workspace",
    "codemigrator.verification",
    "codemigrator.planning",
    "codemigrator.analysis",
    "codemigrator.core",
]

[[tool.importlinter.contracts]]
name = "forbidden product imports"
type = "forbidden"
source_modules = ["codemigrator.core", "codemigrator.analysis", "codemigrator.planning", "codemigrator.verification", "codemigrator.workspace", "codemigrator.sandbox"]
forbidden_modules = ["codemigrator.api", "codemigrator.runtime"]

[[tool.importlinter.contracts]]
name = "independent domain packages"
type = "independence"
modules = ["codemigrator.analysis", "codemigrator.verification"]
