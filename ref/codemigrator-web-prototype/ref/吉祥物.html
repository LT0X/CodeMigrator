<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cat Dev Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0b1f;
  --panel: #1a1733;
  --fg: #f4f1de;
  --muted: #6b6890;
  --accent: #ff6b35;
  --accent-2: #4ecdc4;
  --accent-3: #ffd93d;
  --danger: #ff5e87;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'VT323', monospace;
  min-height: 100vh;
  background-image: 
    linear-gradient(rgba(255, 107, 53, 0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 107, 53, 0.06) 1px, transparent 1px);
  background-size: 32px 32px;
  display: flex;
  overflow: hidden;
}

/* CRT扫描线 */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,0.18) 3px, transparent 4px);
  pointer-events: none; z-index: 9999; mix-blend-mode: multiply;
}

/* 左侧控制面板 */
.sidebar {
  width: 240px;
  background: rgba(13, 11, 31, 0.8);
  backdrop-filter: blur(10px);
  border-right: 2px solid var(--panel);
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  gap: 30px;
  z-index: 10;
  height: 100vh;
}

.logo {
  font-family: 'Press Start 2P', monospace;
  font-size: 14px; color: var(--accent);
  text-shadow: 2px 2px 0 var(--bg);
  letter-spacing: 2px;
}

.panel-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px; color: var(--accent-2);
  letter-spacing: 1px;
  border-bottom: 1px dashed var(--muted);
  padding-bottom: 10px;
}

.state-btn {
  width: 100%;
  padding: 14px 12px;
  margin-bottom: 8px;
  background: rgba(13, 11, 31, 0.6);
  border: 2px solid rgba(255,255,255,0.1);
  color: var(--fg);
  font-family: 'VT323', monospace;
  font-size: 20px;
  cursor: pointer;
  text-align: left;
  display: flex; align-items: center; gap: 12px;
  transition: all 0.2s;
  text-transform: uppercase; letter-spacing: 1px;
}
.state-btn .indicator {
  width: 10px; height: 10px;
  background: var(--muted); flex-shrink: 0;
  transition: all 0.2s;
}
.state-btn:hover {
  border-color: var(--accent);
  transform: translateX(5px);
}
.state-btn:hover .indicator { background: var(--accent); }
.state-btn.active {
  background: var(--accent); color: var(--bg);
  border-color: var(--accent-3);
}
.state-btn.active .indicator {
  background: var(--accent-3);
  animation: live-blink 0.8s infinite;
}
@keyframes live-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* 右侧舞台 */
.stage {
  flex: 1;
  position: relative;
  overflow: hidden;
}

/* 背景效果 */
.stage-bg-glow {
  position: absolute; inset: 0;
  background: 
    radial-gradient(circle at 50% 30%, rgba(78,205,196,0.15), transparent 60%),
    radial-gradient(circle at 50% 80%, rgba(255,107,53,0.1), transparent 60%);
  pointer-events: none;
}
.stars { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.star-bg {
  position: absolute; width: 2px; height: 2px;
  background: var(--fg);
  animation: twinkle-bg var(--dur, 3s) infinite;
}
@keyframes twinkle-bg {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}

/* 桌子 */
.desk {
  position: absolute; bottom: 12%;
  left: 50%; transform: translateX(-50%);
  width: 88%; height: 16px;
  background: linear-gradient(180deg, #6a5a4a 0%, #4a3a2a 100%);
  box-shadow: 
    0 6px 0 #3a2a1a,
    0 12px 0 #2a1a0a,
    0 18px 30px rgba(0,0,0,0.5);
  z-index: 2;
}
.desk::before {
  content: ''; position: absolute; top: 0;
  left: 0; right: 0; height: 2px;
  background: rgba(255, 217, 61, 0.3);
}

/* 键盘 */
.keyboard {
  position: absolute; bottom: calc(12% + 16px);
  left: 50%; transform: translateX(-50%);
  width: 220px; height: 14px;
  background: #2a2a3e;
  border: 1px solid #1a1a2e;
  z-index: 4; /* 键盘在最前，遮挡猫爪 */
  display: grid;
  grid-template-columns: repeat(20, 1fr);
  gap: 1px; padding: 2px;
}
.key {
  background: #3a3a5e;
  animation: key-press 0.4s infinite;
}
@keyframes key-press {
  0%, 100% { background: #3a3a5e; }
  50% { background: var(--accent-2); box-shadow: 0 0 4px var(--accent-2); }
}

/* 咖啡杯 */
.coffee {
  position: absolute; bottom: calc(12% + 16px);
  right: 14%;
  width: 30px; height: 36px;
  background: var(--accent-3);
  z-index: 4;
  box-shadow: 
    inset -3px 0 0 rgba(0,0,0,0.2),
    inset 3px 0 0 rgba(255,255,255,0.2);
}
.coffee::before {
  content: ''; position: absolute;
  right: -10px; top: 8px;
  width: 12px; height: 16px;
  border: 3px solid var(--accent-3);
  border-left: none; background: transparent;
}
.coffee::after {
  content: 'CAF'; position: absolute;
  top: 12px; left: 0; right: 0;
  text-align: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 5px; color: var(--bg);
}

.steam {
  position: absolute; bottom: calc(12% + 16px + 36px);
  right: 14%;
  width: 30px; height: 50px;
  pointer-events: none; z-index: 4;
}
.steam-particle {
  position: absolute; bottom: 0;
  width: 4px; height: 4px;
  background: rgba(244, 241, 222, 0.6);
  border-radius: 50%; filter: blur(1px);
  animation: steam-rise 2.5s infinite;
}
.steam-particle:nth-child(1) { left: 8px; animation-delay: 0s; }
.steam-particle:nth-child(2) { left: 14px; animation-delay: 0.8s; }
.steam-particle:nth-child(3) { left: 20px; animation-delay: 1.6s; }
@keyframes steam-rise {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  20% { opacity: 0.7; }
  100% { transform: translateY(-40px) translateX(8px); opacity: 0; }
}

/* 猫容器 */
.cat-container {
  position: absolute; 
  bottom: calc(12% - 55px); /* 整体下移，使爪子贴近键盘 */
  left: 50%; transform: translateX(-50%);
  width: 260px; height: 260px;
  z-index: 3; /* 在桌子(2)和键盘(4)之间 */
  filter: drop-shadow(0 0 8px rgba(255,107,53,0.4));
}
.cat-shadow {
  position: absolute; bottom: 86px;
  left: 50%; transform: translateX(-50%);
  width: 130px; height: 12px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.6), transparent 70%);
  z-index: -1; pointer-events: none;
  animation: shadow-pulse 2.4s ease-in-out infinite;
}
@keyframes shadow-pulse {
  0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; }
  50% { transform: translateX(-50%) scale(1.05); opacity: 0.6; }
}
.cat-svg {
  width: 100%; height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
}

/* 描述文本 */
.stage-desc {
  position: absolute;
  bottom: 3%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  color: var(--accent-2);
  background: rgba(13, 11, 31, 0.8);
  padding: 8px 20px;
  border-left: 4px solid var(--accent);
  white-space: nowrap;
  z-index: 20;
}

/* SVG部件基础设置 */
.cat-svg .part {
  transform-box: fill-box;
  transform-origin: center;
}
.cat-svg .sunglasses { opacity: 0; transition: opacity 0.3s; }
.cat-svg .eyes-closed { opacity: 0; transition: opacity 0.3s; }
.cat-svg .eyes-open { opacity: 1; transition: opacity 0.3s; }
.cat-svg .sweat-drop { opacity: 0; }
.cat-svg .star-item { opacity: 0; }

/* === RUNNING 状态 === */
/* 修改为向下敲击键盘的动作 */
[data-state="running"] .paw-left { animation: type-l 0.16s infinite; transform-origin: top center; }
[data-state="running"] .paw-right { animation: type-r 0.16s infinite; animation-delay: 0.08s; transform-origin: top center; }
[data-state="running"] .head { animation: lean 2.5s ease-in-out infinite; transform-origin: bottom center; }
[data-state="running"] .body { animation: breathe 2.4s ease-in-out infinite; transform-origin: bottom center; }
[data-state="running"] .tail { animation: wag 1.4s ease-in-out infinite; transform-origin: bottom left; }
[data-state="running"] .eye-l-pupil, [data-state="running"] .eye-r-pupil { animation: look-down 2s ease-in-out infinite; }

@keyframes type-l { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
@keyframes type-r { 0%, 100% { transform: translateY(6px); } 50% { transform: translateY(0); } }
@keyframes lean { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-1px) rotate(-1deg); } }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.04); } }
@keyframes wag { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(8deg); } }
@keyframes look-down { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1px); } }

/* === VERIFIED 状态 === */
[data-state="verified"] .body { animation: proud-stand 2s ease-in-out infinite; transform-origin: bottom center; }
[data-state="verified"] .head { animation: proud-tilt 2s ease-in-out infinite; transform-origin: bottom center; }
[data-state="verified"] .tail { animation: proud-wag 0.5s ease-in-out infinite; transform-origin: bottom left; }
[data-state="verified"] .paw-left { animation: proud-paw-l 2s ease-in-out infinite; transform-origin: top center; }
[data-state="verified"] .paw-right { animation: proud-paw-r 2s ease-in-out infinite; transform-origin: top center; }
[data-state="verified"] .sunglasses { opacity: 1; }
[data-state="verified"] .star-item { opacity: 1; }
[data-state="verified"] .star-1 { animation: star-twirl 1.5s linear infinite; transform-box: fill-box; transform-origin: center; }
[data-state="verified"] .star-2 { animation: star-twirl 1.5s linear infinite; animation-delay: 0.3s; transform-box: fill-box; transform-origin: center; }
[data-state="verified"] .star-3 { animation: star-twirl 1.5s linear infinite; animation-delay: 0.6s; transform-box: fill-box; transform-origin: center; }
[data-state="verified"] .cat-shadow { animation: shadow-glow 2s ease-in-out infinite; }

@keyframes proud-stand { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
@keyframes proud-tilt { 0%, 100% { transform: translateY(-2px) rotate(-3deg); } 50% { transform: translateY(-3px) rotate(3deg); } }
@keyframes proud-wag { 0%, 100% { transform: rotate(-25deg); } 50% { transform: rotate(25deg); } }
@keyframes proud-paw-l { 0%, 100% { transform: translate(-3px, -2px) rotate(-15deg); } 50% { transform: translate(-2px, -1px) rotate(-10deg); } }
@keyframes proud-paw-r { 0%, 100% { transform: translate(3px, -2px) rotate(15deg); } 50% { transform: translate(2px, -1px) rotate(10deg); } }
@keyframes star-twirl { 0% { transform: rotate(0deg) scale(1); opacity: 0.8; } 50% { transform: rotate(180deg) scale(1.4); opacity: 1; } 100% { transform: rotate(360deg) scale(1); opacity: 0.8; } }
@keyframes shadow-glow { 0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; } 50% { transform: translateX(-50%) scale(1.1); opacity: 1; } }

/* === FAILED 状态 === */
[data-state="failed"] .head { animation: confused-tilt 2s ease-in-out infinite; transform-origin: bottom center; }
[data-state="failed"] .eye-l-pupil, [data-state="failed"] .eye-r-pupil { animation: confused-look 2s ease-in-out infinite; }
[data-state="failed"] .sweat-drop { opacity: 1; animation: sweat-confused 2s ease-in-out infinite; }
[data-state="failed"] .cat-shadow { animation: shadow-jitter 2s ease-in-out infinite; }

@keyframes confused-tilt { 0%, 100% { transform: rotate(8deg) translateX(-1px); } 50% { transform: rotate(12deg) translateX(1px); } }
@keyframes confused-look { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(1px); } }
@keyframes sweat-confused { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 80% { opacity: 1; transform: translate(2px, 8px); } 100% { opacity: 0; transform: translate(4px, 12px); } }
@keyframes shadow-jitter { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(calc(-50% - 1px)); } }

/* === WAITING 状态 === */
[data-state="waiting"] .body { animation: sleep-breathe 3.5s ease-in-out infinite; transform-origin: bottom center; }
[data-state="waiting"] .head { animation: sleep-nod 4s ease-in-out infinite; transform-origin: bottom center; }
[data-state="waiting"] .tail { animation: sleep-twitch 5s ease-in-out infinite; transform-origin: bottom left; }
[data-state="waiting"] .eyes-open { opacity: 0; }
[data-state="waiting"] .eyes-closed { opacity: 1; }
[data-state="waiting"] .cat-shadow { animation: shadow-soft 3.5s ease-in-out infinite; }

@keyframes sleep-breathe { 0%, 100% { transform: scaleY(0.96); } 50% { transform: scaleY(1.03); } }
@keyframes sleep-nod { 0%, 100% { transform: translateY(1px) rotate(0deg); } 50% { transform: translateY(3px) rotate(2deg); } }
@keyframes sleep-twitch { 0%, 85%, 100% { transform: rotate(0deg); } 88% { transform: rotate(-20deg); } 91% { transform: rotate(15deg); } 94% { transform: rotate(-10deg); } }
@keyframes shadow-soft { 0%, 100% { transform: translateX(-50%) scale(0.95); opacity: 0.7; } 50% { transform: translateX(-50%) scale(1.05); opacity: 0.5; } }

/* 外部特效 */
.effect-layer { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.effect-element { opacity: 0; position: absolute; font-family: 'Press Start 2P', monospace; }

[data-state="failed"] .question { opacity: 1; animation: question-float 1.8s ease-out infinite; }
[data-state="failed"] .question:nth-child(2) { animation-delay: 0.6s; }
[data-state="failed"] .question:nth-child(3) { animation-delay: 1.2s; }
@keyframes question-float { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-60px) scale(1.4); opacity: 0; } }

[data-state="waiting"] .zzz { opacity: 1; animation: zzz-float 3s ease-out infinite; }
[data-state="waiting"] .zzz:nth-child(2) { animation-delay: 1s; }
[data-state="waiting"] .zzz:nth-child(3) { animation-delay: 2s; }
@keyframes zzz-float { 0% { transform: translate(0, 0) scale(0.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(20px, -50px) scale(1.3); opacity: 0; } }

[data-state="verified"] .confetti { opacity: 1; animation: confetti-fall 2.5s linear infinite; }
@keyframes confetti-fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(400px) rotate(540deg); opacity: 0; } }

.question { color: var(--danger); }
.zzz { color: var(--accent-2); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">PIXEL CAT</div>
  <div class="panel-title">STATE CONTROL</div>
  
  <button class="state-btn active" data-state="running">
    <span class="indicator"></span>
    <span>running</span>
  </button>
  <button class="state-btn" data-state="verified">
    <span class="indicator"></span>
    <span>verified</span>
  </button>
  <button class="state-btn" data-state="failed">
    <span class="indicator"></span>
    <span>failed</span>
  </button>
  <button class="state-btn" data-state="waiting">
    <span class="indicator"></span>
    <span>waiting</span>
  </button>
</aside>

<main class="stage">
  <div class="stage-bg-glow"></div>
  <div class="stars" id="stars"></div>
  
  <!-- 桌子 -->
  <div class="desk"></div>
  
  <!-- 键盘 -->
  <div class="keyboard" id="keyboard"></div>
  
  <!-- 咖啡杯 -->
  <div class="coffee"></div>
  <div class="steam">
    <div class="steam-particle"></div>
    <div class="steam-particle"></div>
    <div class="steam-particle"></div>
  </div>
  
  <!-- 猫阴影 -->
  <div class="cat-shadow"></div>
  
  <!-- 猫 -->
  <div class="cat-container" data-state="running" id="cat">
    <svg class="cat-svg" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <!-- 尾巴 -->
      <g class="part tail">
        <rect x="29" y="18" width="3" height="3" fill="#ff6b35"/>
        <rect x="31" y="15" width="3" height="3" fill="#ff6b35"/>
        <rect x="33" y="12" width="3" height="3" fill="#ff6b35"/>
        <rect x="34" y="9" width="3" height="3" fill="#ff6b35"/>
        <rect x="35" y="7" width="2" height="2" fill="#ffd93d"/>
      </g>
      
      <!-- 身体 -->
      <g class="part body">
        <rect x="10" y="18" width="20" height="11" fill="#ff6b35"/>
        <rect x="10" y="27" width="20" height="2" fill="#cc4422"/>
        <rect x="12" y="20" width="16" height="6" fill="#ff8855" opacity="0.4"/>
      </g>
      
      <!-- 头部 -->
      <g class="part head">
        <!-- 耳朵 -->
        <rect x="12" y="7" width="3" height="4" fill="#ff6b35"/>
        <rect x="13" y="8" width="1" height="2" fill="#ffd93d"/>
        <rect x="25" y="7" width="3" height="4" fill="#ff6b35"/>
        <rect x="26" y="8" width="1" height="2" fill="#ffd93d"/>
        
        <!-- 星星 -->
        <g class="star-item star-1">
          <rect x="11" y="2" width="2" height="2" fill="#ffd93d"/>
          <rect x="9" y="3" width="2" height="1" fill="#ffd93d"/>
          <rect x="13" y="3" width="2" height="1" fill="#ffd93d"/>
          <rect x="10" y="4" width="4" height="1" fill="#ffd93d"/>
        </g>
        <g class="star-item star-2">
          <rect x="19" y="0" width="2" height="2" fill="#ffd93d"/>
          <rect x="17" y="1" width="2" height="1" fill="#ffd93d"/>
          <rect x="21" y="1" width="2" height="1" fill="#ffd93d"/>
          <rect x="18" y="2" width="4" height="1" fill="#ffd93d"/>
        </g>
        <g class="star-item star-3">
          <rect x="27" y="2" width="2" height="2" fill="#ffd93d"/>
          <rect x="25" y="3" width="2" height="1" fill="#ffd93d"/>
          <rect x="29" y="3" width="2" height="1" fill="#ffd93d"/>
          <rect x="26" y="4" width="4" height="1" fill="#ffd93d"/>
        </g>
        
        <!-- 脸 -->
        <rect x="12" y="10" width="16" height="9" fill="#ff6b35"/>
        <rect x="12" y="18" width="16" height="1" fill="#cc4422"/>
        
        <!-- 眼睛睁开 -->
        <g class="eyes-open">
          <rect x="14" y="13" width="4" height="4" fill="#1a1a2e"/>
          <rect x="22" y="13" width="4" height="4" fill="#1a1a2e"/>
          <rect x="15" y="14" width="2" height="2" fill="#4ecdc4" class="eye-l-pupil"/>
          <rect x="23" y="14" width="2" height="2" fill="#4ecdc4" class="eye-r-pupil"/>
          <rect x="15" y="14" width="1" height="1" fill="#ffffff" opacity="0.8"/>
          <rect x="23" y="14" width="1" height="1" fill="#ffffff" opacity="0.8"/>
        </g>
        
        <!-- 眼睛闭上 -->
        <g class="eyes-closed">
          <rect x="14" y="15" width="4" height="1" fill="#1a1a2e"/>
          <rect x="22" y="15" width="4" height="1" fill="#1a1a2e"/>
          <rect x="14" y="14" width="1" height="1" fill="#1a1a2e"/>
          <rect x="17" y="14" width="1" height="1" fill="#1a1a2e"/>
          <rect x="22" y="14" width="1" height="1" fill="#1a1a2e"/>
          <rect x="25" y="14" width="1" height="1" fill="#1a1a2e"/>
        </g>
        
        <!-- 墨镜 -->
        <g class="sunglasses">
          <rect x="13" y="12" width="7" height="4" fill="#1a1a2e"/>
          <rect x="20" y="12" width="7" height="4" fill="#1a1a2e"/>
          <rect x="20" y="13" width="1" height="2" fill="#1a1a2e"/>
          <rect x="14" y="13" width="3" height="1" fill="#4ecdc4"/>
          <rect x="21" y="13" width="3" height="1" fill="#4ecdc4"/>
          <rect x="14" y="14" width="1" height="1" fill="#4ecdc4" opacity="0.6"/>
          <rect x="21" y="14" width="1" height="1" fill="#4ecdc4" opacity="0.6"/>
          <rect x="13" y="12" width="7" height="1" fill="#3a3a5e"/>
          <rect x="20" y="12" width="7" height="1" fill="#3a3a5e"/>
        </g>
        
        <!-- 鼻子 -->
        <rect x="19" y="16" width="2" height="1" fill="#ff8fa3"/>
        <rect x="19" y="17" width="1" height="1" fill="#ff8fa3"/>
        <rect x="20" y="17" width="1" height="1" fill="#ff8fa3"/>
        <rect x="19" y="16" width="1" height="1" fill="#ffb3c6"/>
        
        <!-- 嘴巴 -->
        <rect x="19" y="18" width="2" height="1" fill="#1a1a2e"/>
        <rect x="18" y="18" width="1" height="1" fill="#444466"/>
        <rect x="21" y="18" width="1" height="1" fill="#444466"/>
        
        <!-- 胡须 -->
        <rect x="8" y="13" width="4" height="1" fill="#888899"/>
        <rect x="8" y="15" width="4" height="1" fill="#888899"/>
        <rect x="9" y="17" width="3" height="1" fill="#888899"/>

<script>
// === 星空背景 ===
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 40; i++) {
  const star = document.createElement('div');
  star.className = 'star-bg';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 70 + '%';
  star.style.setProperty('--dur', (2 + Math.random() * 3) + 's');
  star.style.animationDelay = Math.random() * 3 + 's';
  starsContainer.appendChild(star);
}

// === 键盘按键 ===
const keyboard = document.getElementById('keyboard');
for (let i = 0; i < 60; i++) {
  const key = document.createElement('div');
  key.className = 'key';
  key.style.animationDelay = (Math.random() * 0.4) + 's';
  keyboard.appendChild(key);
}

// === 状态切换核心逻辑 ===
const cat = document.getElementById('cat');
const buttons = document.querySelectorAll('.state-btn');
const stageDesc = document.getElementById('stage-desc');
const states = ['running', 'verified', 'failed', 'waiting'];

const stateData = {
  running: { desc: '> 编译中... 猫咪程序员正在专注地敲击键盘' },
  verified: { desc: '> 测试全部通过！猫咪程序员骄傲地挺起胸膛' },
  failed: { desc: '> 编译错误？猫咪歪头疑惑流汗，百思不解' },
  waiting: { desc: '> 等待CI/CD流水线... 猫咪趁机小憩' }
};

function setState(state) {
  cat.dataset.state = state;
  buttons.forEach(b => b.classList.toggle('active', b.dataset.state === state));
  stageDesc.innerHTML = stateData[state].desc;
}

buttons.forEach(btn => {
  btn.addEventListener('click', () => setState(btn.dataset.state));
});

// 隐藏的快捷键支持
document.addEventListener('keydown', (e) => {
  const map = {'1':'running','2':'verified','3':'failed','4':'waiting'};
  if (map[e.key]) setState(map[e.key]);
  if (e.code === 'Space') {
    e.preventDefault();
    const current = cat.dataset.state;
    const idx = states.indexOf(current);
    setState(states[(idx + 1) % states.length]);
  }
});

// 初始化
setState('running');
</script>
</body>
</html>
