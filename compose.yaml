services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      CODEMIGRATOR_API_TOKEN: ${CODEMIGRATOR_API_TOKEN:?CODEMIGRATOR_API_TOKEN must be supplied}
      CODEMIGRATOR_DATABASE_HOST: postgres
      CODEMIGRATOR_DATABASE_NAME: codemigrator
      CODEMIGRATOR_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied}
      CODEMIGRATOR_DATABASE_PORT: "5432"
      CODEMIGRATOR_DATABASE_USER: codemigrator
      CODEMIGRATOR_HTTP_HOST: 0.0.0.0
      CODEMIGRATOR_HTTP_PORT: "8080"
    ports:
      - "127.0.0.1:${CODEMIGRATOR_HTTP_PUBLISHED_PORT:-8080}:8080"
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
    volumes:
      - type: bind
        source: ${CODEMIGRATOR_CGROUP_DELEGATED_DIR:?CODEMIGRATOR_CGROUP_DELEGATED_DIR must point to a delegated cgroup v2 directory}
        target: /sys/fs/cgroup
        read_only: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          url = 'http://127.0.0.1:' + os.environ['CODEMIGRATOR_HTTP_PORT'] + '/api/v1/system/health';
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['CODEMIGRATOR_API_TOKEN']});
          response = urllib.request.urlopen(request, timeout=2);
          response.read();
          response.close()
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: codemigrator
      POSTGRES_USER: codemigrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied by the environment or --env-file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemigrator -d codemigrator"]
      interval: 5s
      timeout: 3s
      retries: 10
